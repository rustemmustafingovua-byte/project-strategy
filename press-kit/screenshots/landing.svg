<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Logo -->
  <text x="600" y="140" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#38bdf8" text-anchor="middle">LUMEN CHAIN</text>
  <text x="600" y="175" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">TypeScript-native blockchain with built-in AMM & x402 payments</text>
  
  <!-- Hero section -->
  <rect x="150" y="220" width="900" height="100" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="265" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" text-anchor="middle">Build decentralized apps in TypeScript</text>
  <text x="600" y="295" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Native AMM · x402 Payments · Docker-ready · Open Core</text>
  
  <!-- Features -->
  <rect x="150" y="350" width="270" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="285" y="385" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Lightning Fast</text>
  <text x="285" y="415" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">4-second slots with PoS</text>
  <text x="285" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">consensus. Sub-second finality.</text>
  <text x="285" y="455" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">$0.001 average fees.</text>
  
  <rect x="465" y="350" width="270" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="385" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">🔗 x402 Payments</text>
  <text x="600" y="415" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Monetize APIs natively.</text>
  <text x="600" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">No Stripe. No PayPal.</text>
  <text x="600" y="455" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Crypto-first billing.</text>
  
  <rect x="780" y="350" width="270" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="915" y="385" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">🛠 Developer First</text>
  <text x="915" y="415" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">TypeScript-native SDK.</text>
  <text x="915" y="435" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Docker deploy in 5 min.</text>
  <text x="915" y="455" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Full docs & examples.</text>
  
  <!-- CTA -->
  <rect x="450" y="560" width="300" height="48" rx="24" fill="#38bdf8"/>
  <text x="600" y="590" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Deploy Your Chain →</text>
  
  <text x="600" y="610" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Open source · MIT License · No sign-up required</text>
</svg>
