  <rect x="20" y="615" width="360" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="640" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#f1f5f9">Received LMN</text>
  <text x="40" y="658" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">From: 0x8a3f...4c21</text>
