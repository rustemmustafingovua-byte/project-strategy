name: CI
# No package.json — verify repo structure and docs instead
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repo structure
        run: |
          ls -la
          test -f README.md || echo "No README.md found"
          test -f AGENTS.md || echo "No AGENTS.md found"
          echo "Repository structure verified."
